# Deploy from the repo root: fly deploy -c api/fly.toml
# (Dockerfile path below is root-relative for the same reason as the Dockerfile itself.)
app = "medrail-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  NETWORK = "mainnet"
  PORT = "4021"
  FACILITATOR_URL = "https://facilitator.goplausible.xyz"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
