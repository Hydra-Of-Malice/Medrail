name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract — compile + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        working-directory: contracts
        run: pip install -r requirements-dev.txt
      - name: Compile
        working-directory: contracts
        run: python -m puyapy smart_contracts/consent/contract.py --out-dir artifacts
      - name: Unit test (AVM simulator, no network)
        working-directory: contracts
        run: pytest tests/ -v

  api:
    name: API — typecheck + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: api
        run: npm ci
      - name: Typecheck
        working-directory: api
        run: npx tsc --noEmit
      - name: Build
        working-directory: api
        run: npm run build
      - name: Test
        working-directory: api
        run: npx vitest run

  web:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:4021
          NEXT_PUBLIC_NETWORK: testnet
        run: npm run build
