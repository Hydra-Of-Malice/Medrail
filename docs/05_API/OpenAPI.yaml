# =============================================================================
# MedRail — OpenAPI 3.1 specification
#
# PROVENANCE — READ THIS FIRST
#   No OpenAPI specification exists in the MedRail repository. This file was
#   AUTHORED BY HAND during the 2026-08-21 technical review, by reading the
#   implementation in api/src/ line by line. It was NOT generated from code by
#   any tool, and no code generates it. It is therefore a *description* of the
#   implementation, not a *contract enforced by* the implementation: nothing in
#   api/src/ validates requests or responses against this document, and it can
#   drift the moment a route changes.
#
#   Sources of truth, in order:
#     api/src/app.ts                 route mounting, CORS, payment middleware,
#                                    /v1/consent/arc56 and / handlers
#     api/src/routes/*.ts            zod schemas and response shapes
#     api/src/services/*.ts          triage and interaction result shapes
#     api/src/config.ts              defaults, network maps
#     api/src/x402.ts                pricing and scheme registration
#
#   Every operation carries an `x-medrail-status` extension recording whether it
#   is VALIDATED (covered by a passing automated test or an on-chain artifact)
#   or UNVALIDATED (implemented, no evidence it works). Labels follow the review's
#   status vocabulary. Do not remove them without re-establishing the evidence.
#
#   Companion documents:
#     ./API_Documentation.md   prose reference, x402 flow, on-chain ABI, defects
#     ./API_Error_Catalog.md   every error, cause, code path, retryability
#     ../04_Data/              the data layer these routes read and write
# =============================================================================

openapi: 3.1.0

info:
  title: MedRail API
  version: 0.1.0
  summary: Patient-consented health data layer under x402-paid intelligence endpoints, on Algorand.
  description: |-
    MedRail exposes **8 HTTP routes**: 3 priced with the x402 protocol (HTTP 402 +
    USDC settlement on Algorand) and 5 free. It also fronts an on-chain consent
    registry and audit log — the `MedRailConsent` smart contract, **App ID 768743428**
    on Algorand TestNet.

    ## What this API is not

    - **There is no database.** Durable state is Algorand global state, three box maps
      on App 768743428, and two static files compiled into the image.
    - **There is no LLM, model, or inference call.** The two "AI" endpoints are
      deterministic rule engines: 11 keyword rules with fixed weights, and a 14-row
      interaction table lookup. Every response carries a non-diagnostic disclaimer.
    - **There are no API keys, tokens, sessions, or accounts.** Payment is the only
      credential. On `POST /v1/records/summary` that credential is a real one: the
      handler recovers the address that signed the payment and refuses the request
      unless it matches the asserted `requesterAddress`.
    - **There is no idempotency.** No idempotency key, no deduplication, no replay
      window. A repeated paid call is a repeated payment.

    ## Settlement happens after the handler, and only on success

    `@x402/hono` awaits the route handler, then cancels the payment on any throw or any
    response with status >= 400 — returning before `processSettlement` is reached
    (`node_modules/@x402/hono/dist/esm/index.mjs:203-232`). **Every 4xx and 5xx in this
    specification therefore leaves the caller uncharged.** The only way to be billed is
    to receive a response below 400.

    ## Authorisation on the consent-gated route

    `POST /v1/records/summary` applies two checks in order:

    1. **Payer binding.** `api/src/x402Payer.ts` decodes the verified `PAYMENT-SIGNATURE`
       header, reads the AVM `exact` payload (`{paymentGroup, paymentIndex}`), and
       recovers the sender of `paymentGroup[paymentIndex]` — the one leg of the atomic
       group the caller signed. If it does not equal `requesterAddress`, the request is
       refused with **403** before any chain call. This is what makes the payment an
       authentication factor rather than a paywall.
    2. **On-chain consent.** `check_access(patientId, requesterAddress, "records:summary")`
       against App 768743428. No active grant → **403** with `charged: false`.

    ## Rate limiting

    Fixed-window, in-memory, per client IP (`api/src/rateLimit.ts`): `GET /v1/consent/status`
    60/min, `GET /v1/consent/arc56` 30/min, `POST /v1/records/summary` 30/min. Over the
    limit → **429** with `Retry-After`; these routes also carry `X-RateLimit-Limit` and
    `X-RateLimit-Remaining` on allowed responses. The three priced happy paths are
    deliberately not throttled — settling USDC per call is a stronger limit. The client
    key is the first `X-Forwarded-For` hop, which a direct caller can spoof: this is a
    courtesy guard, not a security boundary, and it is per-process rather than global.

    ## Middleware ordering — expect 402 before 400

    The x402 payment middleware is registered before every route handler
    (`api/src/app.ts:50-104`), so request-body validation never runs on an unpaid
    request. A malformed body sent to a priced route without payment returns **402,
    not 400**. The repository's own test documents this (`api/test/x402-flow.spec.ts:48-59`).

    ## Error envelopes — two shapes

    Per-route validation and consent errors are flat: `{error: string}` plus
    `{details: {formErrors, fieldErrors}}` on schema failures, with discriminators as
    sibling fields (`payer`, `charged`). Cross-cutting middleware errors use a nested,
    machine-readable envelope `{error: {code, message, retryable, ...}}` with three
    codes: `RATE_LIMITED` (429), `PAYMENT_FACILITATOR_UNAVAILABLE` (503), and
    `INTERNAL_ERROR` (500). Test `typeof body.error === "object"` before reading
    `body.error.code`. Internal exception text is never returned; a `requestId` is
    returned instead and the detail is logged server-side.

    ## Known limitations affecting this surface

    - **Facilitator dependency.** `accepts[].asset` and `extra.feePayer` come from the
      facilitator's `/supported`, so the 402 cannot be built offline. An outage yields a
      clean **503 + `Retry-After: 30`** rather than an opaque 500, but there is still no
      timeout, retry, circuit breaker, or cached fallback.
    - **No replay of a failed audit write.** If the on-chain `log_access` fails, the
      route returns **200** with `auditStatus: "pending"` and null identifiers. Nothing
      queues or retries that entry; it is permanently absent unless an operator replays
      it by hand.
    - **No observability.** No metrics, tracing, or alerting (G-15). Structured error
      logs exist; nothing consumes them.
    - **Not deployed.** There is no public HTTPS instance and no MainNet deployment.
    - **No external payer.** Payments settle between independent accounts — the agent
      pays from its own keypair (`UYBTLPHS…`), which this service does not control, to
      the `payTo` address (`2WDV2J2F…`) — but that agent's TestNet USDC float was seeded
      from the project's own wallet, because TestNet USDC has no other practical source.
      No external or unrelated party has paid for this service.
  contact:
    name: MedRail repository documentation
    url: https://lora.algokit.io/testnet/application/768743428
  license:
    name: See repository
    identifier: NOASSERTION

servers:
  - url: http://localhost:4021
    description: |-
      Local development. `PORT` defaults to 4021 (`api/src/config.ts:47`).
      Start with `cd api && npm run dev`.
  - url: http://127.0.0.1:4021
    description: Local development, loopback literal (identical service).

externalDocs:
  description: Prose API reference, x402 flow, on-chain ABI, and defect analysis
  url: ./API_Documentation.md

tags:
  - name: intelligence
    description: |-
      Deterministic, rule-based clinical helpers. Priced with x402. No model, no
      inference, no external call. Free-text input is processed in memory and is
      never persisted — not on chain, not to disk, not to logs (requirement AI-007).
  - name: records
    description: |-
      The consent-gated record summary. Requires both a settled x402 payment and a
      currently-valid on-chain consent grant. The only route that submits an Algorand
      transaction.
  - name: consent
    description: |-
      Free, unpaid, read-only views of the on-chain consent registry. Grant and revoke
      are NOT endpoints — they are signed by the patient's own wallet directly against
      Algorand (`web/lib/consent.ts`). This backend never holds or proxies a patient key.
  - name: service
    description: Health and discovery.

paths:

  /v1/triage:
    post:
      operationId: postTriage
      tags: [intelligence]
      summary: Rule-based clinical red-flag triage score ($0.02)
      description: |-
        Scores free-text symptoms against **11 hard-coded red-flag keyword groups** with
        fixed weights, sums the weights of all matched groups, caps the total at 100, and
        buckets it into an urgency band.

        **This is not a diagnosis and not a model.** The rule table is at
        `api/src/services/triageScorer.ts:32-44` and is fully inspectable. The function is
        pure: identical input always yields identical output (requirement NFR-009).

        **Weights:** mental health crisis 45 · possible stroke, FAST signs 40 · possible
        anaphylaxis 40 · possible cardiac chest pain 35 · respiratory distress 35 · loss of
        consciousness 30 · severe bleeding 30 · severe pain, unclear source 20 · high fever
        12 · persistent vomiting 10 · common mild symptom 2.

        **Bands:** `emergency` at score >= 60, `urgent` >= 30, `soon` >= 10, else `routine`.

        **Side effects: none.** No chain write, no disk write, no log line. The `symptoms`
        string is lower-cased in memory and discarded with the request.

        **Idempotency: none.** A retry is a second $0.02 payment.
        **Rate limit: none.**
      x-medrail-status: VALIDATED
      x-medrail-requirements: [FR-004, FR-005, FR-006, FR-009, AI-001, AI-002, AI-007, NFR-009]
      x-medrail-evidence: |-
        api/test/triageScorer.spec.ts (7 cases); api/test/x402-flow.spec.ts asserts a real
        402 with accepts[0].amount == "20000"; contracts/artifacts/e2e-proof.json records a
        real 200 obtained after settled transaction
        OYRQRKYA7WUKBVLWTOFJSJMZFBW7VCNGP5VGH5EBUJGRCVFQFJRQ.
      x-medrail-price:
        usd: "0.02"
        baseUnits: "20000"
        asset: USDC
        decimals: 6
      x-medrail-sideEffects: none
      x-medrail-idempotent: false
      x-medrail-rateLimited: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
            examples:
              emergency:
                summary: Cardiac plus respiratory red flags
                value:
                  symptoms: Sudden chest pain and shortness of breath
              routine:
                summary: A mild symptom only
                value:
                  symptoms: mild headache since yesterday
      responses:
        '200':
          $ref: '#/components/responses/TriageOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/FacilitatorUnavailable'

  /v1/interaction-check:
    post:
      operationId: postInteractionCheck
      tags: [intelligence]
      summary: Check a medication list against known severe interaction pairs ($0.02)
      description: |-
        Compares a medication list against a curated table of **14 well-documented severe
        interaction pairs** shipped at `api/src/data/interactions.json` and read once,
        synchronously, at module load (`api/src/services/interactionChecker.ts:18`).

        Matching normalises each name with `trim().toLowerCase()` and then tests
        **bidirectional substring containment** in both directions
        (`m.includes(a) || a.includes(m)`), so partial names such as `"warfarin 5mg"` match.

        **Known weakness (requirement AI-006, NOT IMPLEMENTED):** the containment test is
        unanchored, so a 1-2 character medication name is contained by many table entries
        and produces false positives. The existing test for that input asserts only the
        disclaimer, so the behaviour is uncovered. Fix direction: token-boundary matching
        plus an RxNorm or synonym map.

        Severity distribution in the shipped table: 8 `major`, 3 `contraindicated`,
        3 `moderate`. `matches` is returned in **file order, not severity order**.

        **Side effects: none.** Medication names never leave the process.
        **Idempotency: none.** **Rate limit: none.**
      x-medrail-status: VALIDATED
      x-medrail-requirements: [FR-007, FR-008, FR-009, DATA-005, AI-004, AI-006, AI-007]
      x-medrail-evidence: api/test/interactionChecker.spec.ts (6 cases); api/test/x402-flow.spec.ts asserts a real 402.
      x-medrail-price:
        usd: "0.02"
        baseUnits: "20000"
        asset: USDC
        decimals: 6
      x-medrail-sideEffects: none
      x-medrail-idempotent: false
      x-medrail-rateLimited: false
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
            examples:
              flagged:
                summary: A pair present in the reference table
                value:
                  medications: [warfarin, aspirin]
              clean:
                summary: No table pair matches
                value:
                  medications: [paracetamol, vitamin c]
      responses:
        '200':
          $ref: '#/components/responses/InteractionOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/FacilitatorUnavailable'

  /v1/records/summary:
    post:
      operationId: postRecordsSummary
      tags: [records]
      summary: Consent-gated synthetic patient record summary ($0.05 + on-chain grant)
      description: |-
        Requires **both** a settled x402 payment **and** a currently-valid on-chain consent
        grant from `patientId` to `requesterAddress` for scope `records:summary` on
        `MedRailConsent` App ID 768743428.

        ## Behaviour

        1. The rate limiter admits the request (30/min per client IP) or returns **429**.
        2. The payment middleware verifies the $0.05 USDC payment. **Settlement happens
           later** — only if the handler returns a status below 400.
        3. zod validates both address fields for length **and** Algorand checksum
           (`api/src/validation.ts`). A 58-character non-address is a **400**, not a 500.
        4. `payerFromRequest` recovers the address that signed the payment transaction.
           If it does not equal `requesterAddress`, the API returns **403** with a `payer`
           field — before any chain call is made.
        5. `check_access(patientId, requesterAddress, "records:summary")` is executed as a
           zero-fee `simulate()` call against algod. Nothing is submitted for this step.
        6. **Denied** — an audit entry with `action = "consent_denied"` is attempted, its
           failure is swallowed, and the API returns **403** with `charged: false` and a
           `hint`. The 403 cancels settlement, so the caller pays nothing; MedRail pays the
           chain fee for the denial audit write, which is why this route is rate-limited.
        7. **Allowed** — an audit entry with `action = "consent_checked"` is written to the
           chain as a real transaction signed by the operator/admin account, and the API
           returns 200 with `auditStatus: "recorded"`, `auditTxId` and `auditSequence`. If
           that write fails, the API still returns **200** with `auditStatus: "pending"` and
           null identifiers — a chain fault must not void a consent decision the caller is
           entitled to.
        8. The payment settles.

        ## Things an integrator must know

        - **`requesterAddress` must equal the address that signed the payment.** This is
          what makes the route an authorisation check rather than a paywall: the x402
          middleware proves *a* payment settled, not *whose*, and `grant_access`
          transactions publish every valid (patient, requester, scope) triple to any
          indexer. Binding the two means the only identity you can assert is one you hold
          the key for.
        - **`patientId` selects which grant is checked. It does NOT select data.** The
          `summary` object is a fixed constant (`api/src/routes/records.ts:17-23`) returned
          for every patient. There is no patient datastore (requirement DATA-004).
        - **Branch on `auditStatus`** if the on-chain trail matters to you. `"pending"`
          means the access is not recorded on chain and will not be retried automatically.
        - **`auditSequence` is a decimal STRING or null, not a JSON number.** The underlying
          value is a uint64/bigint outside JSON's safe-integer range and is `.toString()`-ed
          at `api/src/routes/records.ts:109`.
        - **Two distinct 403s.** Discriminate on the presence of `payer` (payer mismatch)
          versus `charged` (no consent grant).
        - **Idempotency: none.** A retry after a timeout costs another $0.05 **and** writes
          a second audit entry. Use the free `GET /v1/consent/status` as a pre-flight.
        - **Cost per call:** permanently locks 58,900-59,300 microALGO of the application
          account's minimum balance, plus 18,900 microALGO on a patient's first-ever entry.
      x-medrail-status: VALIDATED
      x-medrail-requirements: [FR-010, FR-011, FR-012, FR-039, SEC-006, SEC-007, SEC-008, SEC-010, SEC-013, REL-002, DATA-004]
      x-medrail-evidence: |-
        Payer binding: 6 unit tests in api/test/x402Payer.spec.ts, plus a live TestNet run
        by api/scripts/verify-g01-fix.ts which pays with one key while asserting another
        address and confirms the 403, alongside a control call proving the legitimate path
        returns 200. Success path: total_audit_entries == 5 on App 768743428 with five
        audit_log boxes and one audit_seq box, produced by api/scripts/e2e-consent-proof.ts;
        five 50000-base-unit x402 settlements are on the ledger. api/test/x402-flow.spec.ts
        additionally asserts the 402 shape (accepts[0].amount == "50000").
      x-medrail-defects: []
      x-medrail-price:
        usd: "0.05"
        baseUnits: "50000"
        asset: USDC
        decimals: 6
      x-medrail-sideEffects: |-
        Submits a real Algorand transaction (log_access, admin-signed) on BOTH the allowed
        and denied paths, but never on the payer-mismatch path, which returns before any
        chain call. Permanently increases the application account's minimum balance.
      x-medrail-idempotent: false
      x-medrail-rateLimited:
        limit: 30
        windowSeconds: 60
        scope: client-ip
        reason: |-
          A denial is a 403, which cancels settlement — free to the caller, but it costs
          MedRail one Algorand fee for the denial audit write. Unbounded that drains the
          operator account, and an empty operator account stops log_access working for
          everyone.
      security: []
      parameters:
        - $ref: '#/components/parameters/PaymentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordsSummaryRequest'
            examples:
              liveAddresses:
                summary: The two accounts that appear in App 768743428's own grant history
                description: |-
                  The grant box for this exact triple holds status 2 (REVOKED), so it
                  returns 403 today.
                value:
                  patientId: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
                  requesterAddress: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
      responses:
        '200':
          $ref: '#/components/responses/RecordsSummaryOk'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/RecordsForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/FacilitatorUnavailable'

  /v1/consent/status:
    get:
      operationId: getConsentStatus
      tags: [consent]
      summary: Live on-chain consent validity for a (patient, requester, scope) triple (free)
      description: |-
        Free, unpaid, read-only. Executes the contract's `readonly` `check_access` method
        through `AtomicTransactionComposer.simulate()` — **zero fee, nothing submitted to
        the network** (requirement SEC-009).

        `granted` is `true` if and only if all three hold:

        1. the grant box exists;
        2. its `status` is 1 (`STATUS_GRANTED`);
        3. `expires_at == 0` (the "never expires" sentinel) **or**
           `Global.latest_timestamp < expires_at` (strict comparison, so a grant is already
           invalid *at* its expiry second).

        ## Two things that surprise integrators

        - **`scope` is free-form and is not normalised.** No trim, no case folding. The
          scope is hashed into the box key, so `"records:summary "` with a trailing space is
          a completely different grant and silently returns `granted: false`
          (requirement DATA-003).
        - **This free, unauthenticated endpoint requires the operator private key.** The
          simulated call needs a sender and a signer, so `OPERATOR_MNEMONIC` must be set
          (`api/src/services/algorand.ts:83-84`). Without it the endpoint returns 500.

        Two sequential algod round trips per request, with **no timeout and no retry**
        (requirement REL-003, NOT IMPLEMENTED). Because that amplifies traffic at public
        AlgoNode infrastructure at zero cost to the caller, the route is rate-limited to
        **60 requests per minute per client IP** (requirement SEC-013, IMPLEMENTED).
      x-medrail-status: UNVALIDATED
      x-medrail-requirements: [FR-013, SEC-009, SEC-010, SEC-013, DATA-003, REL-003, PERF-002]
      x-medrail-evidence: |-
        No automated test. Manually exercised by the reviewer: HTTP 200 in 505 ms, a single
        cold observation on a developer laptop. Not a p50, not an SLO; no latency budget
        exists.
      x-medrail-defects: []
      x-medrail-sideEffects: none
      x-medrail-idempotent: true
      x-medrail-rateLimited:
        limit: 60
        windowSeconds: 60
        scope: client-ip
        reason: |-
          Free and unauthenticated, and each call makes two sequential algod requests — so
          unbounded it both exhausts this service and amplifies traffic at public AlgoNode
          infrastructure at zero cost to the caller.
      security: []
      parameters:
        - name: patient
          in: query
          required: true
          description: The patient's Algorand address. 58 characters and a valid checksum; a bad checksum is a 400.
          schema:
            $ref: '#/components/schemas/AlgorandAddress'
          example: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
        - name: requester
          in: query
          required: true
          description: The requester's Algorand address. 58 characters and a valid checksum; a bad checksum is a 400.
          schema:
            $ref: '#/components/schemas/AlgorandAddress'
          example: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
        - name: scope
          in: query
          required: true
          description: |-
            Free-form consent scope. Minimum 1 character, no maximum, no normalisation.
            The API's own record route uses `records:summary`.
          schema:
            type: string
            minLength: 1
          example: 'records:summary'
      responses:
        '200':
          description: The live on-chain answer.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusResponse'
              examples:
                revoked:
                  summary: The live triple on App 768743428 — box value decodes to status 2
                  value:
                    patient: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
                    requester: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
                    scope: 'records:summary'
                    granted: false
        '400':
          description: |-
            One or more query parameters failed validation. Note the route-specific message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
              examples:
                lengthFailure:
                  summary: Wrong length, or a missing parameter
                  value:
                    error: 'invalid query — expected ?patient=&requester=&scope='
                    details:
                      formErrors: []
                      fieldErrors:
                        patient: ['must be a 58-character Algorand address']
                        scope: ['String must contain at least 1 character(s)']
                checksumFailure:
                  summary: 58 characters, but not a valid address
                  value:
                    error: 'invalid query — expected ?patient=&requester=&scope='
                    details:
                      formErrors: []
                      fieldErrors:
                        patient: ['not a valid Algorand address (checksum failed)']
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/consent/app-info:
    get:
      operationId: getConsentAppInfo
      tags: [consent]
      summary: Network, CAIP-2 id, App ID and ARC-56 spec location (free)
      description: |-
        A pure configuration read. **Does not contact algod, the facilitator, or the
        contract**, and therefore cannot fail — this route only ever returns 200.

        `consentAppId` is `integer | null`: the handler returns `config.consentAppId || null`
        (`api/src/routes/consent.ts:37`), so an unconfigured instance reports `null`, never
        `0`. The web client treats a falsy value as "contract not deployed yet"
        (`web/lib/consent.ts:39`).

        `arc56SpecUrl` is a **relative** path; resolve it against the API base URL.
      x-medrail-status: UNVALIDATED
      x-medrail-requirements: [FR-014, NFR-012]
      x-medrail-evidence: No automated test. Verified by reading api/src/routes/consent.ts:34-41.
      x-medrail-sideEffects: none
      x-medrail-idempotent: true
      x-medrail-rateLimited: false
      security: []
      responses:
        '200':
          description: Deployment binding for this API instance.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoResponse'
              examples:
                live:
                  summary: The live TestNet deployment
                  value:
                    network: testnet
                    networkCaip2: 'algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI='
                    consentAppId: 768743428
                    arc56SpecUrl: /v1/consent/arc56
                undeployed:
                  summary: No CONSENT_APP_ID configured — api/fly.toml now sets it explicitly
                  value:
                    network: testnet
                    networkCaip2: 'algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI='
                    consentAppId: null
                    arc56SpecUrl: /v1/consent/arc56

  /v1/consent/arc56:
    get:
      operationId: getConsentArc56
      tags: [consent]
      summary: The compiled ARC-56 application specification (free)
      description: |-
        Serves `contracts/artifacts/MedRailConsent.arc56.json` verbatim, so any third party
        can construct their own ABI calls against App 768743428 without this repository.

        Top-level keys: `name`, `structs` (`GrantRecord`, `AuditEntry`), `methods` (13),
        `arcs` (`[22, 28]`), `networks` (**an empty object — the deployed App ID is not
        recorded in the spec; use `/v1/consent/app-info`**), `state`, `bareActions`,
        `sourceInfo`.

        **Implementation note:** the file is `existsSync`-ed, `readFileSync`-read and
        `JSON.parse`-d on **every request** (`api/src/app.ts:141-147`) — a synchronous
        ~54 KB disk read and parse in the event loop, on a free, unauthenticated route.
        Reading it once at module load would be strictly better. RECOMMENDED. The route is
        rate-limited to 30 requests per minute per client IP, which bounds the cost without
        removing it.
      x-medrail-status: UNVALIDATED
      x-medrail-requirements: [FR-015, SEC-013]
      x-medrail-evidence: No automated test. Verified by reading api/src/app.ts:141-148.
      x-medrail-sideEffects: none
      x-medrail-idempotent: true
      x-medrail-rateLimited:
        limit: 30
        windowSeconds: 60
        scope: client-ip
        reason: Free, and it reads and parses a ~54 KB file from disk on every request.
      security: []
      responses:
        '200':
          description: The ARC-56 application specification.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                type: object
                description: |-
                  An ARC-56 Contract object. Not modelled field by field here; the served
                  document is authoritative.
                additionalProperties: true
                required: [name, structs, methods, arcs, state, bareActions]
                properties:
                  name:
                    type: string
                    const: MedRailConsent
                  arcs:
                    type: array
                    items:
                      type: integer
                    examples:
                      - [22, 28]
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          description: |-
            The compiled artifact is not present on disk at
            `__dirname/../../contracts/artifacts/MedRailConsent.arc56.json`. In a container
            this means the Dockerfile COPY step was skipped or the path resolution differs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error: 'ARC-56 spec not found — has the contract been compiled?'

  /v1/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Liveness probe (free)
      description: |-
        **`ok` is always literally `true`.** This is a liveness signal, not a readiness
        check: it does not probe algod, the facilitator, or the contract. A green
        `/v1/health` is fully compatible with all three priced endpoints returning
        503 `PAYMENT_FACILITATOR_UNAVAILABLE`.

        The `chain` block reports the two balances that keep the audit trail alive, read
        stale-while-revalidate so the response never waits on algod. `chain.warning` is the
        signal worth watching before a demo: once audit writes become unaffordable, paid
        calls still return 200 and quietly degrade to `auditStatus: "pending"`.

        `api/fly.toml` wires it as the platform health check on exactly that understanding
        — a 30-second interval with a 10-second grace period. That closes defect D-6 for
        liveness; readiness remains unaddressed (requirement OPS-001).
      x-medrail-status: VALIDATED
      x-medrail-requirements: [FR-016, OPS-001, REL-005]
      x-medrail-evidence: |-
        api/test/x402-flow.spec.ts "health check is free and unpaid" asserts 200 and
        body.ok === true; "reports chain-account health without ever blocking on the
        network" asserts the response returns in under a second, and "populates exactly one
        of chain / chainError" pins that invariant. api/test/algorandService.spec.ts covers
        the sampler itself across 11 cases. The reviewer also confirmed it stays 200 with
        the facilitator unreachable (requirement REL-005, VALIDATED).
      x-medrail-sideEffects: none
      x-medrail-idempotent: true
      x-medrail-rateLimited: false
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                ok: true
                service: medrail-api
                network: testnet
                consentAppId: 768743428
                chain:
                  operatorAddress: 2WDV2J2FTWF535SMSUVEBOF5IGXF2OTV7ZZTLTCRBXPVS32UMLOPTI64GE
                  operatorSpendableMicroAlgo: 96000
                  appAccountAddress: CCO26Y6Z56DDZ3OELO2UKJMIPJVSIT52I23F2MPMR52JBM3HQZZNUZNOR4
                  appAccountSpendableMicroAlgo: 3866300
                  microAlgoPerAuditWrite: 1000
                  estimatedAuditWritesRemaining: 96
                  warning: null
                  sampledAt: '2026-08-22T16:32:19.279Z'
                chainError: null
                time: '2026-08-22T16:32:22.481Z'

  /:
    get:
      operationId: getServiceIndex
      tags: [service]
      summary: Machine-readable service index (free)
      description: |-
        An integrator's first fetch. Returns **all 8 mounted routes** with method, path,
        price and gate, plus a `contract` block (App ID, network, CAIP-2 chain id, ARC-56
        spec URL) and an `x402` block (version, scheme, facilitator).

        `contract` + `arc56SpecUrl` are precisely the pair needed to build an ABI client
        against App 768743428 without cloning this repository. An earlier revision listed
        only 5 routes and omitted both `app-info` and `arc56`, so a client discovering
        MedRail here could not reach the spec the index pointed at.
        `api/test/app.spec.ts` now asserts that the advertised set equals the mounted set,
        so the list cannot drift again.

        **Remaining nit:** `docs` is a repo-relative hint (`"see repo docs/API.md"`), not a
        resolvable URL. RECOMMENDED, unfixed.
      x-medrail-status: VALIDATED
      x-medrail-requirements: [FR-017]
      x-medrail-evidence: |-
        api/test/app.spec.ts (7 cases) asserts that the advertised endpoint list equals the
        set of mounted routes, and checks the contract and x402 blocks.
      x-medrail-sideEffects: none
      x-medrail-idempotent: true
      x-medrail-rateLimited: false
      security: []
      responses:
        '200':
          description: Service index.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIndexResponse'
              example:
                service: MedRail
                description: Patient-consented health data layer under x402-paid AI intelligence endpoints, on Algorand.
                endpoints:
                  - { method: POST, path: /v1/triage,            price: '$0.02', gate: x402 }
                  - { method: POST, path: /v1/interaction-check, price: '$0.02', gate: x402 }
                  - { method: POST, path: /v1/records/summary,   price: '$0.05', gate: 'x402 + on-chain consent' }
                  - { method: GET,  path: /v1/consent/status,    price: free,    gate: none }
                  - { method: GET,  path: /v1/consent/app-info,  price: free,    gate: none }
                  - { method: GET,  path: /v1/consent/arc56,     price: free,    gate: none }
                  - { method: GET,  path: /v1/health,            price: free,    gate: none }
                  - { method: GET,  path: /,                     price: free,    gate: none }
                contract:
                  appId: 768743428
                  network: testnet
                  networkCaip2: 'algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI='
                  arc56SpecUrl: /v1/consent/arc56
                x402:
                  version: 2
                  scheme: exact
                  facilitator: https://facilitator.goplausible.xyz
                docs: see repo docs/API.md

components:

  securitySchemes:
    x402Payment:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
      description: |-
        **Not an authentication scheme.** Modelled as `apiKey` only because OpenAPI has no
        native x402 type. The `PAYMENT-SIGNATURE` header carries a base64-encoded JSON
        `PaymentPayload` containing a signed Algorand transaction group, produced by an
        x402 v2 client such as `@x402/fetch` with `@x402/avm`'s `ExactAvmScheme`.

        The middleware's own check proves that **a payment settled**; on its own it does not
        tell a route handler whose payment it was. `POST /v1/records/summary` therefore
        decodes the same header a second time (`api/src/x402Payer.ts`) to recover the
        address that signed `paymentGroup[paymentIndex]`, and refuses the request unless it
        equals the asserted `requesterAddress` — which is what makes the payment an
        authentication factor on that route.

        Every operation still declares `security: []`, because there is no *credential
        scheme* here in OpenAPI's sense: no API key, no token, no session. The credential is
        the signed payment itself.

  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      description: |-
        Base64-encoded JSON `PaymentPayload` — the signed x402 payment. Omit it to receive
        the 402 challenge in the `PAYMENT-REQUIRED` response header. Header lookup is
        case-insensitive.
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json

  headers:
    PaymentRequired:
      description: |-
        **Base64-encoded JSON.** The x402 v2 payment challenge. Decode with
        `JSON.parse(Buffer.from(header, "base64").toString("utf-8"))`.

        Shape: `{x402Version, error, resource: {url, description, mimeType}, accepts: [...]}`.
        `accepts[].asset` and `accepts[].extra.feePayer` are supplied by the facilitator's
        `/supported` endpoint, not by MedRail configuration — which is why the challenge
        cannot be constructed while the facilitator is unreachable, and why that condition
        returns 503 rather than 402.
      required: true
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
      example: eyJ4NDAyVmVyc2lvbiI6MiwiZXJyb3IiOiJQYXltZW50IHJlcXVpcmVkIiwicmVzb3VyY2UiOnsidXJsIjoiaHR0cDovL2xvY2FsaG9zdC92MS90cmlhZ2UifX0=
    PaymentResponse:
      description: |-
        **Base64-encoded JSON.** The facilitator's settlement result. Present **only on a
        response with status below 400** — settlement runs after the handler and is
        cancelled on any throw or any 4xx/5xx, so no error response ever carries one.
        Decoded shape:
        `{success: boolean, transaction: string, network: string, payer?: string, amount?: string, errorReason?: string, errorMessage?: string}`.

        `transaction` is the settled Algorand transaction id — for example
        `OYRQRKYA7WUKBVLWTOFJSJMZFBW7VCNGP5VGH5EBUJGRCVFQFJRQ`, verifiable at
        `https://lora.algokit.io/testnet/transaction/{transaction}`.
      required: false
      schema:
        type: string
        contentEncoding: base64
        contentMediaType: application/json
    CacheControlNoStore:
      description: Always `no-store` on a 402 — a payment challenge must never be cached.
      required: false
      schema:
        type: string
        const: no-store
    AccessControlAllowOrigin:
      description: Always `*` — CORS is fully open by design (`api/src/app.ts:25`, requirement NFR-006).
      required: false
      schema:
        type: string
        const: '*'
    AccessControlExposeHeaders:
      description: |-
        Always `PAYMENT-REQUIRED,PAYMENT-RESPONSE` (`api/src/app.ts:33`), so browser
        JavaScript can read the two x402 headers.
      required: false
      schema:
        type: string
        const: PAYMENT-REQUIRED,PAYMENT-RESPONSE
    RetryAfter:
      description: |-
        Seconds to wait before retrying. Emitted on **429** (the remainder of the current
        rate-limit window, `api/src/rateLimit.ts:65`) and on **503** (a fixed 30,
        `api/src/app.ts:91`).
      required: false
      schema:
        type: integer
        minimum: 1
      example: 30
    RateLimitLimit:
      description: |-
        The request budget for this route's window. Emitted on every response from a
        rate-limited route, not only on a refusal.
      required: false
      schema:
        type: integer
      example: 60
    RateLimitRemaining:
      description: |-
        Requests left in the current window. `0` on a 429. Emitted on every response from a
        rate-limited route, so a well-behaved client can back off before being refused.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 42

  schemas:

    AlgorandAddress:
      type: string
      minLength: 58
      maxLength: 58
      description: |-
        A base32 Algorand address.

        **Validated for length AND checksum.** The zod schema is `algorandAddress`
        (`api/src/validation.ts`): `.length(58)` followed by
        `.refine(algosdk.isValidAddress)`. A 58-character string that is not a valid
        address is rejected as **HTTP 400** with the field error
        `"not a valid Algorand address (checksum failed)"`, before it can reach
        `algosdk.decodeAddress` (requirement SEC-010, IMPLEMENTED). The `pattern` below
        documents the character set; the checksum constraint cannot be expressed in JSON
        Schema and is enforced in code.
      examples:
        - S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
        - CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA

    TriageRequest:
      type: object
      required: [symptoms]
      additionalProperties: true
      description: |-
        `additionalProperties: true` is accurate: the zod schema is a plain `z.object` with
        no `.strict()`, so unknown properties are ignored rather than rejected.
      properties:
        symptoms:
          type: string
          minLength: 1
          maxLength: 2000
          description: |-
            Free-text symptom description. **Never persisted** — lower-cased in memory,
            matched against the rule table, then discarded with the request
            (requirement AI-007).

    TriageResponse:
      type: object
      required: [score, band, matchedFlags, disclaimer]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Sum of the weights of all matched red-flag groups, capped at 100.
        band:
          $ref: '#/components/schemas/UrgencyBand'
        matchedFlags:
          type: array
          maxItems: 11
          description: |-
            Labels of the red-flag groups that matched, in rule-table order. May be empty.
          items:
            type: string
            enum:
              - possible cardiac chest pain
              - respiratory distress
              - possible stroke (FAST signs)
              - loss of consciousness
              - severe bleeding
              - mental health crisis
              - possible anaphylaxis
              - severe pain, unclear source
              - high fever
              - persistent vomiting
              - common mild symptom
        disclaimer:
          type: string
          description: |-
            A fixed non-diagnostic warning, present on every response and asserted by an
            automated test (requirements FR-009 and AI-002, VALIDATED).

    UrgencyBand:
      type: string
      enum: [routine, soon, urgent, emergency]
      description: |-
        Derived purely from `score`: `emergency` at >= 60, `urgent` >= 30, `soon` >= 10,
        else `routine`. Evaluated top-down, so the bands partition 0-100 with no gap and
        no overlap (`api/src/services/triageScorer.ts:46-51`).

    InteractionRequest:
      type: object
      required: [medications]
      additionalProperties: true
      properties:
        medications:
          type: array
          minItems: 2
          maxItems: 20
          description: |-
            Medication names. Each entry must be at least 1 character. Names are trimmed and
            lower-cased in memory and **never persisted** (requirement AI-007). There is no
            RxNorm or ATC normalisation and no synonym map.
          items:
            type: string
            minLength: 1

    InteractionResponse:
      type: object
      required: [flagged, matches, source, disclaimer]
      properties:
        flagged:
          type: boolean
          description: Exactly `matches.length > 0`.
        matches:
          type: array
          maxItems: 14
          description: Matched reference rows, in **file order, not severity order**. May be empty.
          items:
            $ref: '#/components/schemas/InteractionMatch'
        source:
          type: string
          description: |-
            Provenance of the reference table, returned verbatim on every response and
            asserted by an automated test (requirements DATA-005 and AI-004, VALIDATED).
            It names a reference *class*, not a licensed dataset.
        disclaimer:
          type: string

    InteractionMatch:
      type: object
      required: [drugs, severity, description]
      properties:
        drugs:
          type: array
          minItems: 2
          maxItems: 2
          description: |-
            The **canonical table names**, not the caller's spelling. A caller who sends
            `"Warfarin 5mg"` sees `"warfarin"` returned.
          items:
            type: string
        severity:
          $ref: '#/components/schemas/InteractionSeverity'
        description:
          type: string
          description: Mechanism and clinical consequence, verbatim from the reference table.

    InteractionSeverity:
      type: string
      enum: [moderate, major, contraindicated]
      description: |-
        Taken verbatim from `api/src/data/interactions.json`; the API never computes it.
        There is **no ordering or numeric mapping** of severity anywhere in the code — a
        client that wants "worst first" must impose its own order. Shipped distribution:
        8 `major`, 3 `contraindicated`, 3 `moderate`.

    RecordsSummaryRequest:
      type: object
      required: [patientId, requesterAddress]
      additionalProperties: true
      properties:
        patientId:
          allOf:
            - $ref: '#/components/schemas/AlgorandAddress'
          description: |-
            **Selects which consent grant is checked. Does NOT select data.** The `summary`
            object is a fixed constant returned for every patient (requirement DATA-004).
        requesterAddress:
          allOf:
            - $ref: '#/components/schemas/AlgorandAddress'
          description: |-
            **Must equal the address that signed the payment.** `api/src/x402Payer.ts`
            recovers the payer from the verified `PAYMENT-SIGNATURE` header and the handler
            returns 403 unless the two match, before any chain call. Only then is the value
            written into the immutable on-chain audit log, so what lands there is an
            identity someone paid to assert with their own key (requirements SEC-007 and
            SEC-008, both IMPLEMENTED).

    RecordsSummaryResponse:
      type: object
      required:
        - patientId
        - requesterAddress
        - scope
        - summary
        - consentVerifiedOnChain
        - auditStatus
        - auditTxId
        - auditSequence
        - disclaimer
      properties:
        patientId:
          $ref: '#/components/schemas/AlgorandAddress'
        requesterAddress:
          allOf:
            - $ref: '#/components/schemas/AlgorandAddress'
          description: |-
            On this path the value is provably the address that signed the payment.
        scope:
          type: string
          const: 'records:summary'
          description: Hard-coded at `api/src/routes/records.ts:12`. The client cannot choose a scope.
        summary:
          $ref: '#/components/schemas/SyntheticRecord'
        consentVerifiedOnChain:
          type: boolean
          const: true
          description: |-
            Hard-coded `true` on this branch — a statement that the code reached it, not an
            independently checkable proof.
        auditStatus:
          $ref: '#/components/schemas/AuditStatus'
        auditTxId:
          type: [string, 'null']
          minLength: 52
          maxLength: 52
          description: |-
            Algorand transaction id of the `log_access` write, verifiable at
            `https://lora.algokit.io/testnet/transaction/{auditTxId}`.
            **`null` when `auditStatus` is `"pending"`.**
        auditSequence:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: |-
            **A decimal STRING, not a JSON number.** The contract returns a uint64, which is
            a `bigint` in Node and outside JSON's safe-integer range, so it is
            `.toString()`-ed at `api/src/routes/records.ts:109`. Parse it as an integer.
            **`null` when `auditStatus` is `"pending"`.**
        disclaimer:
          type: string

    AuditStatus:
      type: string
      enum: [recorded, pending]
      description: |-
        Whether this call's audit entry reached the chain
        (`api/src/routes/records.ts:82`).

        - `recorded` — the `log_access` transaction confirmed. `auditTxId` and
          `auditSequence` are populated.
        - `pending` — the audit write threw and was caught. The consent decision was
          still valid and the record is still returned; `auditTxId` and `auditSequence`
          are `null`.

        `pending` is a deliberate degradation, not an error. Returning a 5xx here would
        cancel settlement and discard a response the caller was entitled to, while the
        caller's money was never at risk either way. The failure is logged server-side as
        a structured `audit_write_failed` event, but **there is no queue and no automatic
        replay** — a `pending` access is permanently absent from the patient's on-chain
        trail unless an operator replays it. Clients that depend on the audit trail must
        branch on this field.

    SyntheticRecord:
      type: object
      description: |-
        **A single hard-coded constant** (`api/src/routes/records.ts:17-23`) returned for
        every `patientId`. There is no patient datastore anywhere in the system
        (requirement DATA-004).
      required: [bloodType, allergies, chronicConditions, currentMedications, lastUpdated]
      properties:
        bloodType:
          type: string
          const: O+
        allergies:
          type: array
          items:
            type: string
          examples:
            - [penicillin]
        chronicConditions:
          type: array
          items:
            type: string
          examples:
            - ['type 2 diabetes (controlled)']
        currentMedications:
          type: array
          items:
            type: string
          examples:
            - ['metformin 500mg', 'lisinopril 10mg']
        lastUpdated:
          type: string
          const: '2026-01-15'
          description: A constant string, not a date type. It is never recomputed.

    ConsentDeniedBody:
      type: object
      required: [error, patientId, requesterAddress, charged, hint]
      description: |-
        The consent-denied 403 (`api/src/routes/records.ts:59-70`). Reached only once the
        payer has been proved to be the asserted requester.
      properties:
        error:
          type: string
          const: no valid consent grant from this patient for this requester and scope
        patientId:
          $ref: '#/components/schemas/AlgorandAddress'
        requesterAddress:
          $ref: '#/components/schemas/AlgorandAddress'
        charged:
          type: boolean
          const: false
          description: |-
            **The caller was not billed.** A 403 is >= 400, so `@x402/hono` cancels the
            payment instead of settling it. This is structural, not a refund.

            The residual cost is MedRail's: the denied path still submits a
            `log_access(..., "consent_denied")` transaction whose fee the operator account
            pays. That is why this route is rate-limited to 30 requests per minute.
        hint:
          type: string
          const: 'GET /v1/consent/status?patient=&requester=&scope=records:summary is free'
          description: |-
            Points at the free pre-flight check that avoids paying for a denial entirely.

    PayerMismatchBody:
      type: object
      required: [error, requesterAddress, payer]
      description: |-
        The payer-binding 403 (`api/src/routes/records.ts:43-50`). Emitted **before** any
        chain call, so it costs nothing on either side.

        Discriminate the two 403 bodies on the presence of `payer` (this one) versus
        `charged` (`ConsentDeniedBody`).
      properties:
        error:
          type: string
          const: requesterAddress must match the address that signed the payment
        requesterAddress:
          allOf:
            - $ref: '#/components/schemas/AlgorandAddress'
          description: The address the request body asserted.
        payer:
          type: [string, 'null']
          minLength: 58
          maxLength: 58
          pattern: '^[A-Z2-7]{58}$'
          description: |-
            The address recovered from the verified `PAYMENT-SIGNATURE` header — the sender
            of `paymentGroup[paymentIndex]`, the one leg of the atomic group the caller
            signed. **`null` when the header is absent or unparseable**, which the handler
            treats as unauthenticated rather than trusted.

    ErrorEnvelope:
      type: object
      required: [error]
      description: |-
        The machine-readable envelope used by cross-cutting middleware errors. Distinct
        from the flat `{error: string}` shape that per-route validation and consent errors
        use — test `typeof body.error === "object"` before reading `body.error.code`.
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [RATE_LIMITED, PAYMENT_FACILITATOR_UNAVAILABLE, INTERNAL_ERROR]
              description: Stable machine-readable condition identifier. Branch on this, not on prose.
            message:
              type: string
              description: |-
                Human-readable explanation. On `INTERNAL_ERROR` this is a **fixed generic
                string** — the underlying exception text is logged server-side and never
                returned.
            retryable:
              type: boolean
              description: Whether retrying can succeed. Pair with `Retry-After` where present.
            requestId:
              type: string
              format: uuid
              description: |-
                Present on `INTERNAL_ERROR` only. Correlates the response with the
                server-side log line (`api/src/app.ts:117`). Quote it when reporting a fault
                — it is the only handle a caller has on an internal error.
            facilitator:
              type: string
              format: uri
              description: |-
                Present on `PAYMENT_FACILITATOR_UNAVAILABLE` only. The facilitator URL that
                could not be reached, so a caller can distinguish "MedRail is broken" from
                "MedRail's payment facilitator is down".

    ConsentStatusResponse:
      type: object
      required: [patient, requester, scope, granted]
      properties:
        patient:
          $ref: '#/components/schemas/AlgorandAddress'
        requester:
          $ref: '#/components/schemas/AlgorandAddress'
        scope:
          type: string
        granted:
          type: boolean
          description: |-
            `true` iff the grant box exists, `status == 1`, and either `expires_at == 0`
            (never expires) or the consensus timestamp is strictly less than `expires_at`.

    AppInfoResponse:
      type: object
      required: [network, networkCaip2, consentAppId, arc56SpecUrl]
      properties:
        network:
          $ref: '#/components/schemas/NetworkName'
        networkCaip2:
          type: string
          description: |-
            CAIP-2 chain identifier, also used as `accepts[].network` in the x402 challenge.
          enum:
            - 'algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI='
            - 'algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8='
        consentAppId:
          type: [integer, 'null']
          description: |-
            `config.consentAppId || null` — an unconfigured instance reports `null`, never
            `0`. The live TestNet value is `768743428`.
          examples:
            - 768743428
            - null
        arc56SpecUrl:
          type: string
          const: /v1/consent/arc56
          description: A **relative** path. Resolve it against the API base URL.

    HealthResponse:
      type: object
      required: [ok, service, network, consentAppId, chain, chainError, time]
      properties:
        ok:
          type: boolean
          const: true
          description: Always literally `true`. Not a dependency check.
        service:
          type: string
          const: medrail-api
        network:
          $ref: '#/components/schemas/NetworkName'
        consentAppId:
          type: [integer, 'null']
        chain:
          oneOf:
            - $ref: '#/components/schemas/ChainAccountHealth'
            - type: 'null'
          description: |-
            The last successful sample of the two accounts that fund the audit trail, or
            `null` if none has landed. Exactly one of `chain` and `chainError` is non-null.
        chainError:
          type: [string, 'null']
          description: Why there is no sample yet. Non-null only when `chain` is null.
        time:
          type: string
          format: date-time
          description: Server wall clock, `new Date().toISOString()` — ISO-8601 UTC with milliseconds.

    ChainAccountHealth:
      type: object
      description: |-
        `log_access` is signed by the operator, which pays the fee, while the audit box it
        writes lives under the application account, which pays the box MBR. Either running
        dry stops audit writes — and the caller cannot tell, because the paid call still
        returns 200 and degrades to `auditStatus: "pending"`.

        Sampled stale-while-revalidate and primed at boot, so reading this never waits on
        algod. A liveness endpoint that blocks on a third-party network call is not a
        liveness endpoint.
      required:
        - operatorAddress
        - operatorSpendableMicroAlgo
        - appAccountAddress
        - appAccountSpendableMicroAlgo
        - microAlgoPerAuditWrite
        - estimatedAuditWritesRemaining
        - warning
        - sampledAt
      properties:
        operatorAddress:
          $ref: '#/components/schemas/AlgorandAddress'
        operatorSpendableMicroAlgo:
          type: integer
          minimum: 0
          description: Balance minus minimum balance. What is actually spendable on fees.
        appAccountAddress:
          oneOf:
            - $ref: '#/components/schemas/AlgorandAddress'
            - type: 'null'
          description: Null when no `CONSENT_APP_ID` is configured.
        appAccountSpendableMicroAlgo:
          type: [integer, 'null']
          minimum: 0
        microAlgoPerAuditWrite:
          type: integer
          const: 1000
          description: The operator's fee per `log_access`. Box MBR is charged to the app account, not this one.
        estimatedAuditWritesRemaining:
          type: integer
          minimum: 0
          description: The smaller of what each account can still fund. Deliberately conservative.
        warning:
          type: [string, 'null']
          description: Non-null below 20 remaining writes, and again at zero with a different message.
        sampledAt:
          type: string
          format: date-time

    ServiceIndexResponse:
      type: object
      required: [service, description, endpoints, contract, x402, docs]
      properties:
        service:
          type: string
          const: MedRail
        description:
          type: string
        endpoints:
          type: array
          minItems: 8
          maxItems: 8
          description: |-
            **All 8 mounted routes** (`api/src/app.ts:158-167`), as objects rather than
            strings. `api/test/app.spec.ts` asserts that this list equals the mounted route
            set, so it cannot drift out of sync without failing a build.
          items:
            $ref: '#/components/schemas/ServiceIndexEndpoint'
        contract:
          $ref: '#/components/schemas/ServiceIndexContract'
        x402:
          $ref: '#/components/schemas/ServiceIndexX402'
        docs:
          type: string
          description: A repo-relative hint, not a resolvable URL. RECOMMENDED, unfixed.

    ServiceIndexEndpoint:
      type: object
      required: [method, path, price, gate]
      properties:
        method:
          type: string
          enum: [GET, POST]
        path:
          type: string
          examples: ['/v1/records/summary']
        price:
          type: string
          description: |-
            A **display string** — `"$0.02"`, `"$0.05"`, or `"free"`. The authoritative
            microUSDC amount is `accepts[].amount` in the 402 challenge.
          examples: ['$0.05', free]
        gate:
          type: string
          enum: [x402, 'x402 + on-chain consent', none]
          description: |-
            What stands between a caller and the response. Only `/v1/records/summary`
            carries the consent gate, and that gate also enforces payer binding.

    ServiceIndexContract:
      type: object
      description: |-
        Everything needed to build an ABI client against the deployed consent contract
        without cloning this repository. Paired with `arc56SpecUrl`, this is a complete
        integration entry point.
      required: [appId, network, networkCaip2, arc56SpecUrl]
      properties:
        appId:
          type: [integer, 'null']
          description: |-
            The deployed `MedRailConsent` App ID, or `null` when `CONSENT_APP_ID` is unset
            (`config.consentAppId || null`, so 0 surfaces as null). Live value 768743428.
          examples: [768743428]
        network:
          $ref: '#/components/schemas/NetworkName'
        networkCaip2:
          type: string
          description: |-
            CAIP-2 chain id — the same value the 402 challenge advertises as
            `accepts[].network`.
          examples: ['algorand:SGO1GKSzyE7IEPItTxCByw9x8FmnrCDexi9/cOUJOiI=']
        arc56SpecUrl:
          type: string
          const: /v1/consent/arc56
          description: |-
            Relative path to the ARC-56 specification. Resolve it against the API base. It
            is now reachable from the index that advertises it — an earlier revision listed
            neither this route nor `app-info`.

    ServiceIndexX402:
      type: object
      description: Protocol parameters a paying client needs before its first 402.
      required: [version, scheme, facilitator]
      properties:
        version:
          type: integer
          const: 2
        scheme:
          type: string
          const: exact
        facilitator:
          type: string
          format: uri
          examples: ['https://facilitator.goplausible.xyz']

    NetworkName:
      type: string
      enum: [testnet, mainnet]
      description: |-
        From the `NETWORK` environment variable, default `testnet`. **No MainNet deployment
        of `MedRailConsent` exists**, so `mainnet` currently yields a service pointed at a
        network where the contract is absent (defect D-2 — `api/fly.toml` hard-codes exactly
        that).

    ErrorBody:
      type: object
      required: [error]
      additionalProperties: true
      description: |-
        The **flat** error shape, used by per-route validation and consent handlers. It
        carries no machine-readable code; discriminate on the HTTP status plus the sibling
        fields a route documents (`payer`, `charged`).

        Cross-cutting middleware errors use `ErrorEnvelope` instead — a nested
        `{error: {code, message, retryable, ...}}` with a stable `code`. Test
        `typeof body.error === "object"` before reading `body.error.code`.
      properties:
        error:
          type: string
          description: |-
            A human-readable message chosen by the handler. Internal exception text is never
            surfaced this way: unhandled faults go through `app.onError`, which returns the
            `ErrorEnvelope` with a fixed generic message and a `requestId`
            (requirement SEC-011, IMPLEMENTED).

    ValidationErrorBody:
      allOf:
        - $ref: '#/components/schemas/ErrorBody'
        - type: object
          required: [details]
          properties:
            details:
              $ref: '#/components/schemas/ZodFlattenedError'

    ZodFlattenedError:
      type: object
      description: |-
        The output of zod's `.flatten()` (zod resolves to 3.25.76 under the declared
        `^3.24.1`). Verified empirically against the installed package.
      required: [formErrors, fieldErrors]
      properties:
        formErrors:
          type: array
          description: |-
            Object-level issues. **Empty for every schema in this codebase**, because none
            uses an object-level `.refine()`.
          items:
            type: string
        fieldErrors:
          type: object
          description: Per-field messages, keyed by field name.
          additionalProperties:
            type: array
            items:
              type: string
          examples:
            - symptoms: [Required]
            - medications: ['Array must contain at least 2 element(s)']
            - patientId: ['String must contain exactly 58 character(s)']

  responses:

    TriageOk:
      description: A triage score for the submitted symptom text.
      headers:
        PAYMENT-RESPONSE:
          $ref: '#/components/headers/PaymentResponse'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Expose-Headers:
          $ref: '#/components/headers/AccessControlExposeHeaders'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TriageResponse'
          examples:
            emergency:
              summary: Real output, reproduced from contracts/artifacts/e2e-proof.json
              value:
                score: 70
                band: emergency
                matchedFlags:
                  - possible cardiac chest pain
                  - respiratory distress
                disclaimer: >-
                  MedRail triage is a transparent keyword heuristic for hackathon
                  demonstration only. It is not a diagnosis, not a substitute for
                  professional medical judgment, and must never be the basis for a real care
                  decision. If this were real and urgent, call emergency services.
            routine:
              summary: A single low-weight rule matched
              value:
                score: 2
                band: routine
                matchedFlags: [common mild symptom]
                disclaimer: MedRail triage is a transparent keyword heuristic for hackathon demonstration only. ...

    InteractionOk:
      description: The interaction-check result.
      headers:
        PAYMENT-RESPONSE:
          $ref: '#/components/headers/PaymentResponse'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Expose-Headers:
          $ref: '#/components/headers/AccessControlExposeHeaders'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InteractionResponse'
          examples:
            flagged:
              summary: Real output for ["warfarin", "aspirin"]
              value:
                flagged: true
                matches:
                  - drugs: [warfarin, aspirin]
                    severity: major
                    description: Combined anticoagulant/antiplatelet effect substantially increases bleeding risk.
                source: >-
                  Widely-taught, textbook-level severe drug-interaction pairs (e.g. standard
                  pharmacology references such as Lexicomp/Micromedex-class severity
                  classifications). Not exhaustive and not a substitute for a pharmacist or
                  prescriber review.
                disclaimer: >-
                  MedRail interaction-check compares against a small, explicitly-sourced
                  reference table of well-documented severe interactions — it is not a
                  comprehensive clinical database and must never replace a pharmacist or
                  prescriber review before making a medication decision.
            clean:
              summary: No table pair matched
              value:
                flagged: false
                matches: []
                source: Widely-taught, textbook-level severe drug-interaction pairs ...
                disclaimer: MedRail interaction-check compares against a small, explicitly-sourced reference table ...

    RecordsSummaryOk:
      description: |-
        Payer bound, consent verified on chain, record summary returned.

        **VALIDATED** — `total_audit_entries` on App 768743428 is 5, with five `audit_log`
        boxes and one `audit_seq` box, produced by `api/scripts/e2e-consent-proof.ts`. Five
        matching 50000-base-unit x402 settlements are on the ledger.

        The `auditStatus` field distinguishes the two shapes of this response: `recorded`
        (the audit entry reached the chain) and `pending` (it did not; `auditTxId` and
        `auditSequence` are `null` and the record is returned anyway).
      headers:
        PAYMENT-RESPONSE:
          $ref: '#/components/headers/PaymentResponse'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Expose-Headers:
          $ref: '#/components/headers/AccessControlExposeHeaders'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordsSummaryResponse'
          example:
            patientId: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
            requesterAddress: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
            scope: 'records:summary'
            summary:
              bloodType: O+
              allergies: [penicillin]
              chronicConditions: ['type 2 diabetes (controlled)']
              currentMedications: ['metformin 500mg', 'lisinopril 10mg']
              lastUpdated: '2026-01-15'
            consentVerifiedOnChain: true
            auditStatus: recorded
            auditTxId: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            auditSequence: '5'
            disclaimer: Synthetic demo data for the Global x402 Challenge — no real patient information exists in this system.

    RecordsForbidden:
      description: |-
        **Two distinct conditions share this status.** Discriminate on which field is
        present: `payer` (the payment was signed by a different account than the one
        asserted) or `charged` (the payer is the requester, but no consent grant exists).

        **Neither charges the caller.** A 403 is >= 400, so `@x402/hono` cancels the payment
        instead of settling it — there is no `PAYMENT-RESPONSE` header on either.

        - **Payer mismatch** is emitted before any chain call, so it costs nothing on either
          side.
        - **Consent denied** attempts a `consent_denied` audit entry first, and **its failure
          is deliberately swallowed** (`api/src/routes/records.ts:58`) so the caller still
          gets a coherent 403. MedRail pays that transaction fee, which is why this route is
          rate-limited.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/PayerMismatchBody'
              - $ref: '#/components/schemas/ConsentDeniedBody'
          examples:
            payerMismatch:
              summary: The payment was signed by a different account than the one asserted
              value:
                error: requesterAddress must match the address that signed the payment
                requesterAddress: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
                payer: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
            noPaymentSignature:
              summary: The PAYMENT-SIGNATURE header was absent or unparseable
              value:
                error: requesterAddress must match the address that signed the payment
                requesterAddress: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
                payer: null
            consentDenied:
              summary: Payer is the requester, but no active grant exists for this triple
              value:
                error: no valid consent grant from this patient for this requester and scope
                patientId: S56WIB3XLUOXSUGAI6MDJ3GN3RV2NSE7RVV7DGNZJKDCJR4OJLLA6H7HEE
                requesterAddress: CVYBERM3GTWGASZ7VUJLCBTVQA7AOPPTUW2Q3EISGR3XCRIKLM6SBIGUUA
                charged: false
                hint: 'GET /v1/consent/status?patient=&requester=&scope=records:summary is free'

    PaymentRequired:
      description: |-
        No payment, an invalid payment, or a failed settlement.

        **The body is the empty object `{}`** — the entire payload is in the
        `PAYMENT-REQUIRED` header. Verified against a live capture.

        Also returned for a **malformed unpaid request**: the payment middleware runs before
        the route handler, so zod never sees an unpaid body. The repository's own test
        documents this (`api/test/x402-flow.spec.ts:48-59`).

        A 402 is >= 400, so no settlement is attempted and the caller is not charged.
      headers:
        PAYMENT-REQUIRED:
          $ref: '#/components/headers/PaymentRequired'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Expose-Headers:
          $ref: '#/components/headers/AccessControlExposeHeaders'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: Always `{}` in the current configuration.
          example: {}

    ValidationError:
      description: |-
        The request body failed zod validation. **Only reachable after a payment has
        settled**, because the payment middleware runs first (see the 402 response).
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorBody'
          examples:
            triageMissingField:
              summary: 'POST /v1/triage with body {}'
              value:
                error: invalid request
                details:
                  formErrors: []
                  fieldErrors:
                    symptoms: [Required]
            interactionTooFew:
              summary: 'POST /v1/interaction-check with one medication'
              value:
                error: 'invalid request — provide at least 2 medications'
                details:
                  formErrors: []
                  fieldErrors:
                    medications: ['Array must contain at least 2 element(s)']
            recordsBadLength:
              summary: 'POST /v1/records/summary with a short address'
              value:
                error: invalid request
                details:
                  formErrors: []
                  fieldErrors:
                    patientId: ['String must contain exactly 58 character(s)']

    InternalError:
      description: |-
        An unhandled exception reached `app.onError` (`api/src/app.ts:113-139`), which
        generates a `requestId`, logs the method, path, message and stack server-side as one
        structured JSON line, and returns a **fixed generic body**. The internal exception
        text is never returned (requirement SEC-011, IMPLEMENTED).

        Known causes:

        - `CONSENT_APP_ID` unset and `contracts/artifacts/deploy_testnet.json` absent. This
          used to be the container default; `api/fly.toml` now sets
          `CONSENT_APP_ID = "768743428"` explicitly.
        - `OPERATOR_MNEMONIC` unset — which also breaks the *free* `/v1/consent/status`,
          since `simulate()` still needs a sender and a signer.
        - **R-4** — algod unreachable or slow. `new algosdk.Algodv2("", server, "")` has no
          timeout and no retry (requirement REL-003, NOT IMPLEMENTED).

        Two conditions that used to land here no longer do: a facilitator outage is now a
        **503** (`FacilitatorUnavailable`) and a malformed address is now a **400**
        (`ValidationError`).

        Settlement is cancelled on any 5xx, so **a 500 never charges the caller.**

        Full catalogue: `./API_Error_Catalog.md`.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: An internal error occurred. Quote the requestId when reporting this.
              retryable: true
              requestId: 3f2a1c88-6b0e-4d2f-9a71-0c5b8e4d6f10

    RateLimited:
      description: |-
        The client exceeded this route's fixed window (`api/src/rateLimit.ts:60-78`).

        Limits: `GET /v1/consent/status` 60/min, `GET /v1/consent/arc56` 30/min,
        `POST /v1/records/summary` 30/min — all keyed by client IP. The three priced happy
        paths are deliberately **not** throttled, because settling USDC per call is a
        stronger limit than a counter.

        `X-RateLimit-Limit` and `X-RateLimit-Remaining` are also emitted on *allowed*
        responses, so a well-behaved client can back off before being refused.

        **Honest limitation:** the store is in-memory, so limits are per-process rather than
        global, and the client key is the first `X-Forwarded-For` hop, which a direct caller
        can spoof. This is a courtesy guard against hammering and casual abuse, not a
        security boundary (requirement SEC-013, IMPLEMENTED).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests. Retry in 37s.
              retryable: true

    FacilitatorUnavailable:
      description: |-
        The x402 facilitator could not be reached, so a payment challenge cannot be issued
        (`api/src/app.ts:78-104`).

        This is unavoidable rather than a design choice: `accepts[].asset` and
        `extra.feePayer` come from the facilitator's own `/supported`, not from MedRail
        config, so the 402 cannot be constructed offline. **No `PAYMENT-REQUIRED` header is
        emitted.** The guard matches exactly two initialisation-failure messages and
        re-throws everything else, so it cannot mask an unrelated fault as an upstream
        outage. The event is logged server-side as `facilitator_unavailable`.

        **Blast radius is bounded and was verified:** `/v1/health`, `/`, and
        `/v1/consent/app-info` all still return 200 with the facilitator down. Only the
        three priced routes fail.

        This condition previously returned an opaque **500** with the internal message as
        the body and no `Retry-After`, which told a calling agent "this is broken" when the
        truth was "try again shortly".

        **What is not fixed:** there is still no timeout, retry, circuit breaker, or cached
        `/supported` fallback (requirement REL-001, PARTIALLY IMPLEMENTED — graceful
        degradation yes, resilience no).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: PAYMENT_FACILITATOR_UNAVAILABLE
              message: The payment facilitator is temporarily unreachable, so a payment challenge cannot be issued. Retry shortly.
              retryable: true
              facilitator: https://facilitator.goplausible.xyz
